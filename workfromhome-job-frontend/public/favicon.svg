<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1e40af" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" filter="url(#badgeShadow)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" fill="none" />

  <!-- Stylized Modern 'R' + Desk Monogram -->
  <!-- Left Pillar -->
  <rect x="16" y="15" width="7" height="34" rx="3.5" fill="url(#brandGrad)" />

  <!-- Top Rounded Loop -->
  <path d="M19 15H33C39.0751 15 44 19.4772 44 25C44 30.5228 39.0751 35 33 35H19V15Z" fill="url(#brandGrad)" />
  <path d="M23 21H32C34.7614 21 37 22.7909 37 25C37 27.2091 34.7614 29 32 29H23V21Z" fill="#1d4ed8" />

  <!-- Dynamic Kick / Upward Desk Leg -->
  <path d="M30 32L42.8 47.4C43.5 48.3 44.8 49 46 49H47C48.6 49 49.6 47.2 48.6 45.9L36.8 32H30Z" fill="url(#accentGrad)" />

  <!-- Glowing Live Remote Status Indicator Dot -->
  <circle cx="48" cy="16" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="48" cy="16" r="2" fill="#ffffff" />
</svg>
